<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GamePulse — Article</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            🎮 GamePulse
        </a>

        <nav>

            <a href="index.html#trending">
                Trending
            </a>

            <a href="index.html#news">
                Latest News
            </a>

            <a href="index.html#categories">
                Categories
            </a>

        </nav>

        <button
            class="menu-button"
            id="menuButton"
            aria-label="Open menu"
        >
            ☰
        </button>

    </div>

</header>


<main>

    <article
        class="article-page"
        id="articleContainer"
    >

        <div class="loading">

            Loading article...

        </div>

    </article>

</main>


<footer>

    <div>

        <h3>
            🎮 GamePulse
        </h3>

        <p>
            Gaming news, without the noise.
        </p>

    </div>

    <p>
        © 2026 GamePulse
    </p>

</footer>


<script>

const API_URL =
    "https://gamepulse-api-ecat.onrender.com";


const articleContainer =
    document.getElementById(
        "articleContainer"
    );


/* ===============================
   GET ARTICLE ID
================================ */

const params =
    new URLSearchParams(
        window.location.search
    );


const articleId =
    params.get("id");


/* ===============================
   LOAD ARTICLE
================================ */

async function loadArticle() {

    try {

        if (!articleId) {

            throw new Error(
                "Article ID missing"
            );

        }


        const response =
            await fetch(
                `${API_URL}/api/live-news`
            );


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        const data =
            await response.json();


        if (
            !data.success ||
            !data.news
        ) {

            throw new Error(
                "Article data unavailable"
            );

        }


        const article =
            data.news.find(
                item =>
                    String(item.id) ===
                    String(articleId)
            );


        if (!article) {

            throw new Error(
                "Article not found"
            );

        }


        displayArticle(article);


    } catch (error) {

        console.error(
            "Article error:",
            error
        );


        articleContainer.innerHTML = `

            <div class="no-results">

                <h2>
                    Article not found
                </h2>

                <p>
                    This article could not be loaded.
                </p>

                <a
                    href="index.html"
                    class="hero-button"
                >
                    ← Back to GamePulse
                </a>

            </div>

        `;

    }

}


/* ===============================
   DISPLAY ARTICLE
================================ */

function displayArticle(article) {

    document.title =
        `${article.title} — GamePulse`;


    articleContainer.innerHTML = `

        <div class="article-header">

            <p class="section-label">

                ${article.category || "Gaming"}

            </p>


            <h1>

                ${article.title}

            </h1>


            <div class="article-meta">

                <span>

                    📰 ${article.source || "GamePulse"}

                </span>

                <span>

                    📅 ${article.date || "Today"}

                </span>

            </div>

        </div>


        <div class="article-image">

            ${article.image || "🎮"}

        </div>


        <div class="article-content">

            <p class="article-description">

                ${
                    article.description ||
                    "Latest gaming news from GamePulse."
                }

            </p>


            <div class="article-actions">

                <a
                    href="${article.link}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="hero-button"
                >
                    Read Original Story →
                </a>


                <a
                    href="index.html"
                    class="back-button"
                >
                    ← Back to News
                </a>

            </div>

        </div>

    `;

}


/* ===============================
   MOBILE MENU
================================ */

const menuButton =
    document.getElementById(
        "menuButton"
    );


const nav =
    document.querySelector(
        "header nav"
    );


if (menuButton && nav) {

    menuButton.addEventListener(
        "click",
        () => {

            nav.classList.toggle(
                "mobile-open"
            );

        }
    );

}


/* ===============================
   START
================================ */

loadArticle();

</script>

</body>

</html>
